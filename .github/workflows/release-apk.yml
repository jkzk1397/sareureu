name: release-apk

# Actions 탭 › release-apk › Run workflow로 실행한다. 친구 기능이 들어간 디버그 APK를 만들어 공개 Release로 올린다.
# 저장소 Secrets가 필요하다(값은 로그에 나오지 않는다):
#   GOOGLE_SERVICES_JSON : app/google-services.json 파일 내용 그대로
#   SOCIAL_BASE_URL      : 친구 서버 주소(https://…, local.properties의 socialBaseUrl과 같은 값)
# 같은 태그의 Release가 이미 있으면 APK를 새 것으로 바꾼다.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 태그"
        default: "v0.13"
      apk:
        description: "APK 파일 이름"
        default: "sareureu-week13.apk"
      title:
        description: "Release 제목"
        default: "사르르 13주차"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: 비밀 설정 넣기(커밋하지 않음)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          SOCIAL_BASE_URL: ${{ secrets.SOCIAL_BASE_URL }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$SOCIAL_BASE_URL" ]; then
            echo "::error::저장소 Secrets에 GOOGLE_SERVICES_JSON과 SOCIAL_BASE_URL을 먼저 넣어 주세요."
            exit 1
          fi
          case "$SOCIAL_BASE_URL" in https://*) ;; *) echo "::error::SOCIAL_BASE_URL은 https://로 시작해야 합니다."; exit 1;; esac
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf 'socialBaseUrl=%s\n' "$SOCIAL_BASE_URL" > local.properties
      - name: 디버그 빌드
        run: ./gradlew assembleDebug
      - name: Release 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          APK: ${{ inputs.apk }}
          TITLE: ${{ inputs.title }}
        run: |
          cp app/build/outputs/apk/debug/*.apk "$APK"
          NOTES="친구 기능(QR 초대, 지금 시청 중, 연속 일수 랭킹, 실시간 잔소리)이 들어간 빌드입니다. 친구 탭에서 공유에 동의하면 쓸 수 있습니다. 예전 버전과 서명이 달라 '앱이 설치되지 않음'이 뜨면 기존 앱을 지우고 설치해 주세요. 시연 모드는 설정 › 더 보기 › 시연 모드. ${GITHUB_REF_NAME} ${GITHUB_SHA::7} 기준."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target "${GITHUB_SHA}" --title "$TITLE" --notes "$NOTES"
          fi
