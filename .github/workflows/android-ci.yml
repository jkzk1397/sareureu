name: android-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: 포맷 검사
        run: ./gradlew spotlessCheck
      - name: 단위 테스트 + lint
        run: ./gradlew check
      - name: 디버그 빌드
        run: ./gradlew assembleDebug
      - name: 디버그 APK 보관(로컬 빌드 없이 폰에 깔아 보기용)
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
      - name: AI 평가(모의 제공자)
        run: ./gradlew :core:ai-engine:aiEval -Pprovider=mock
      - name: 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/**
          retention-days: 7
