name = "sareureu"
main = "src/index.mjs"
compatibility_date = "2026-11-09"

[vars]
FIREBASE_PROJECT_ID = "sareureu-e7f70"
# 초대 QR 페이지에서 앱이 없을 때 받을 설치 파일(https만).
APK_URL = "https://github.com/jkzk1397/sareureu/releases/download/v0.13/sareureu-week13.apk"

[[d1_databases]]
binding = "DB"
database_name = "sareureu-db"
database_id = "726d6949-5349-479b-b097-58fd611cf9fb"

[triggers]
crons = ["0 20 * * *"]

# IP 기준 요청 제한(ADR-0014). Workers Rate Limiting 바인딩: IP마다 60초에 20번(대략적, 지역마다 따로 센다).
# 동의·연결 요청·잔소리 보내기·신고 경로에만 건다(src/index.mjs의 ipLimit). IP는 저장하지 않는다.
# 이 설정 때문에 배포가 실패하면 이 묶음만 지우면 된다(코드는 바인딩이 없어도 동작한다).
# 배포에 쓰이는 wrangler가 새 설정 이름([[ratelimits]])을 모르는 버전이어도 되게, 예전부터 있던 이름으로 적는다.
[[unsafe.bindings]]
name = "IP_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
